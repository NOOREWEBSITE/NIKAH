<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NikahMatch Admin Login</title>
<style>body{margin:0;font-family:system-ui;background:#f5f6fa;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:32px;border-radius:18px;width:min(420px,88%);box-shadow:0 15px 45px #0001}input{display:block;width:100%;padding:12px;box-sizing:border-box;margin:7px 0 15px;border:1px solid #ddd;border-radius:9px}button{width:100%;padding:13px;background:#8b3d65;color:#fff;border:0;border-radius:9px;font-weight:700}.err{color:#b42318;margin-top:12px}</style>
<div class="box"><h1>NikahMatch Admin</h1><p>Private administration area</p><form id="f"><b>Username</b><input id="u" required><b>Password</b><input id="p" type="password" required><button>Login</button><div id="e" class="err"></div></form></div>
<script>const U="FAHAD786",P="Super9876@";f.onsubmit=e=>{e.preventDefault();if(u.value===U&&p.value===P){sessionStorage.nikahAdmin="1";location="dashboard.html"}else e.textContent="Invalid username or password."}</script>
